<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You are Offline — StayBite</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 40px 30px;
      border-radius: 20px;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    .logo {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
      border-radius: 50%;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 10px;
      color: #0d9488;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 25px;
    }
    .btn {
      background: linear-gradient(135deg, #0d9488, #ea580c);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="StayBite Logo" class="logo" />
    <h1>You're currently offline</h1>
    <p>Please check your internet connection. StayBite will automatically reload when you are back online.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
